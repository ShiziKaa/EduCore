name: edu_core
description: "EduCore"

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  file_picker: ^11.0.2
  dio: ^5.9.0
  video_player: ^2.10.0
  video_player_win: ^3.2.2
  window_manager: ^0.5.1
  carousel_slider: ^5.1.2
  smooth_page_indicator: ^2.0.1
  audioplayers: ^6.1.0
  o3d: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icons/launcher_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#F5F7FA"
  adaptive_icon_foreground: assets/icons/launcher_icon.png
  web:
    generate: true
    image_path: assets/icons/launcher_icon.png
    background_color: "#F5F7FA"
    theme_color: "#0D9488"
  windows:
    generate: true
    image_path: assets/icons/launcher_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icons/launcher_icon.png

flutter:

  uses-material-design: true

  assets:
    - assets/icons/launcher_icon.png
    - assets/avatar/avatar.glb
